<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>NFT Preview Card</title>
</head>
<body>
    <main>
        <section class="card">
            <div class="image-container">
                <img src="images/image-equilibrium.jpg" alt="Equilibrium Image" class="card-image">
                <div class="overlay">
                    <img src="images/icon-view.svg" alt="View Icon" class="view-icon">
                </div>
            </div>
            <h1 class="card-title">Equilibrium #3429</h1>
            <p class="card-description">Our Equilibrium collection promotes balance and calm.</p>
            <div class="card-info">
                <div class="price">
                    <img src="images/icon-ethereum.svg" alt="Ethereum" class="icon">
                    <span>0.041 ETH</span>
                </div>
                <div class="time">
                    <img src="images/icon-clock.svg" alt="Clock" class="icon">
                    <span>3 days left</span>
                </div>
            </div>
            <div class="divider"></div>
            <div class="creator">
                <img src="images/image-avatar.png" alt="Creator Avatar" class="avatar">
                <span>Creation of <strong>Jules Wyvern</strong></span>
            </div>
        </section>
    </main>
</body>
</html>
